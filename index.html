<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Menu Sistema Escolar - SP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('./governo.webp'); /* Caminho da imagem */
            background-size: cover; /* Faz a imagem ocupar toda a tela */
            background-position: center; /* Centraliza a imagem */
            background-repeat: no-repeat; /* Evita repetição */
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: rgba(0, 51, 102, 0.8); /* Transparência para destacar sobre a imagem */
            color: white;
            padding: 20px;
        }
        .menu {
            margin-top: 50px;
        }
        .menu a {
            display: inline-block;
            margin: 20px;
            padding: 15px 30px;
            background-color: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        .menu a:hover {
            background-color: #004c99;
        }
        .menu img {
            display: block;
            margin: 0 auto 10px auto;
            width: 80px;
            height: 80px;
        }

}
